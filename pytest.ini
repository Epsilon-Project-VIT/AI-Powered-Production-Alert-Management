[pytest]
# Pytest configuration for alert management system

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    nim_live: marks tests that make real NIM API calls (deselect with '-m "not nim_live"')
    gemini_live: marks tests that make real Gemini API calls
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

# Output
addopts = -ra --strict-markers

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning:pydantic.*:
